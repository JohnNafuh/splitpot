<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <title>Wallet · splitpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .wallet {
      padding-top: 24px;
    }

    .wallet .label {
      font-size: 0.9rem;
      color: var(--moss);
    }

    .wallet .amount {
      margin-top: 4px;
      font-size: clamp(2.6rem, 12vw, 3.4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--brass);
    }

    .wallet .locked {
      margin-top: 10px;
      color: var(--moss);
    }

    .wallet section + section {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .wallet h2 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .wallet .hint {
      margin-top: 6px;
      color: var(--moss);
      line-height: 1.45;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .chips button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 36, 25, 0.45);
      font-weight: 600;
    }

    .chips button[aria-pressed="true"] {
      border-color: var(--brass);
      background: var(--felt-raised);
      color: var(--brass);
    }

    .wallet .btn {
      width: 100%;
      margin-top: 14px;
      border: 0;
    }

    .wallet .btn:disabled {
      opacity: 0.6;
    }

    .status {
      min-height: 1.4em;
      margin-top: 10px;
      line-height: 1.4;
    }

    .status.ok { color: #8FD6A8; }
    .status.bad { color: #F2A39A; }

    .history {
      margin-top: 12px;
      padding: 0;
      list-style: none;
    }

    .history li {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .history .what {
      font-weight: 600;
    }

    .history .meta {
      margin-top: 2px;
      font-size: 0.85rem;
      color: var(--moss);
    }

    .history .money {
      font-weight: 800;
      white-space: nowrap;
    }

    .history .money.in { color: #8FD6A8; }
    .history .money.out { color: var(--moss); }

    .empty {
      margin-top: 14px;
      color: var(--moss);
      line-height: 1.45;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="index.html">splitpot</a>
  </header>

  <main class="wallet">

    <section aria-labelledby="balanceHeading">
      <p class="label" id="balanceHeading">Available</p>
      <p class="amount" id="available">₦0.00</p>
      <p class="locked" id="locked">₦0.00 locked in rooms</p>
    </section>

    <section aria-labelledby="testHeading">
      <h2 id="testHeading">Add test money</h2>
      <p class="hint">Test money isn't real. It lets you try rooms before real payments are switched on.</p>

      <div class="chips" role="group" aria-label="Choose an amount">
        <button type="button" data-amount="1000" aria-pressed="false">₦1,000</button>
        <button type="button" data-amount="5000" aria-pressed="true">₦5,000</button>
        <button type="button" data-amount="10000" aria-pressed="false">₦10,000</button>
      </div>

      <button class="btn btn-primary" type="button" id="addFunds">Add ₦5,000 test money</button>
      <p class="status" id="status" role="status"></p>
    </section>

    <section aria-labelledby="historyHeading">
      <h2 id="historyHeading">History</h2>
      <ul class="history" id="history"></ul>
      <p class="empty" id="empty" hidden>No transactions yet. Add test money to get started.</p>
    </section>

  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="rooms.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.6 1.9 5.3 5.1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="wallet.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="notify.js"></script>

  <script>
    const LABELS = {
      test_funds: "Test money added",
      deposit: "Deposit",
      withdrawal: "Withdrawal",
      stake_lock: "Stake locked",
      payout: "Winnings",
      refund: "Refund"
    };

    const availableEl = document.getElementById("available");
    const lockedEl = document.getElementById("locked");
    const chips = document.querySelectorAll(".chips button");
    const addFunds = document.getElementById("addFunds");
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");
    const emptyEl = document.getElementById("empty");

    let selected = 5000;
    let userId = null;

    const fromKobo = (kobo) =>
      "₦" + (kobo / 100).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const naira = (n) => "₦" + n.toLocaleString("en-NG");

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    async function loadWallet() {
      const { data, error } = await sb
        .from("wallets")
        .select("balance, locked_balance")
        .eq("user_id", userId)
        .maybeSingle();

      if (error) throw error;

      const balance = data ? data.balance : 0;
      const locked = data ? data.locked_balance : 0;
      availableEl.textContent = fromKobo(balance);
      lockedEl.textContent = fromKobo(locked) + " locked in rooms";
    }

    async function loadHistory() {
      const { data, error } = await sb
        .from("ledger")
        .select("id, type, amount, created_at, rooms(code)")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) throw error;

      historyEl.innerHTML = "";
      emptyEl.hidden = data.length > 0;

      data.forEach((row) => {
        const li = document.createElement("li");

        const left = document.createElement("div");
        const what = document.createElement("p");
        what.className = "what";
        what.textContent = LABELS[row.type] || row.type;

        const meta = document.createElement("p");
        meta.className = "meta";
        const when = new Date(row.created_at).toLocaleString("en-NG", {
          day: "numeric",
          month: "short",
          hour: "numeric",
          minute: "2-digit"
        });
        meta.textContent = row.rooms ? when + " · Room " + row.rooms.code : when;

        left.append(what, meta);

        const money = document.createElement("p");
        const incoming = row.amount > 0;
        money.className = "money " + (incoming ? "in" : "out");
        money.textContent = (incoming ? "+" : "−") + fromKobo(Math.abs(row.amount));

        li.append(left, money);
        historyEl.append(li);
      });
    }

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        selected = Number(chip.dataset.amount);
        chips.forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        addFunds.textContent = "Add " + naira(selected) + " test money";
        setStatus("");
      });
    });

    addFunds.addEventListener("click", async () => {
      addFunds.disabled = true;
      setStatus("Adding…");

      try {
        const { error } = await sb.rpc("add_test_funds", { amount_naira: selected });
        if (error) throw error;

        await Promise.all([loadWallet(), loadHistory()]);
        setStatus(naira(selected) + " test money added.", "ok");
      } catch (err) {
        setStatus(err.message || "Could not add test money. Try again.", "bad");
      } finally {
        addFunds.disabled = false;
      }
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.replace("login.html");
        return;
      }

      userId = session.user.id;

      try {
        await Promise.all([loadWallet(), loadHistory()]);
      } catch (err) {
        setStatus(err.message || "Could not load your wallet.", "bad");
      }
    })();
  </script>
</body>
</html>
