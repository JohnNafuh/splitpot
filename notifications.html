<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="splitpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
  <title>Notifications · splitpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .inbox {
      padding-top: 24px;
    }

    .inbox h1 {
      font-size: clamp(1.9rem, 8vw, 2.3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .note-list {
      margin-top: 16px;
      padding: 0;
      list-style: none;
    }

    .note {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 12px;
      padding: 16px 4px;
      border-bottom: 1px solid var(--line);
    }

    .note .dot {
      width: 8px;
      height: 8px;
      margin-top: 8px;
      border-radius: 50%;
    }

    .note.unread .dot {
      background: var(--brass);
    }

    .note .body {
      line-height: 1.45;
    }

    .note.unread .body {
      font-weight: 600;
    }

    .note .time {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--moss);
    }

    .push-card {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid rgba(227, 179, 65, 0.4);
      border-radius: 18px;
      background: rgba(227, 179, 65, 0.08);
    }

    .push-card .title {
      font-weight: 800;
    }

    .push-card .text {
      margin-top: 4px;
      color: var(--moss);
      line-height: 1.45;
    }

    .push-card .btn {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      border: 0;
      font-size: 1rem;
    }

    .push-card .btn-secondary {
      border: 1.5px solid var(--line);
      background: transparent;
    }

    .push-card .btn:disabled {
      opacity: 0.5;
    }

    .empty {
      margin-top: 16px;
      color: var(--moss);
      line-height: 1.45;
    }

    .error {
      margin-top: 16px;
      color: #F2A39A;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="index.html">splitpot</a>
  </header>

  <main class="inbox">
    <h1>Notifications</h1>

    <section class="push-card" id="pushCard" hidden>
      <p class="title" id="pushTitle"></p>
      <p class="text" id="pushText"></p>
      <button class="btn btn-primary" type="button" id="pushBtn" hidden></button>
    </section>
    <ul class="note-list" id="list"></ul>
    <p class="empty" id="empty" hidden>No notifications yet. You'll hear here when friends join your rooms, when it's time to vote, and when games are paid out.</p>
    <p class="error" id="error" role="alert"></p>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="rooms.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.6 1.9 5.3 5.1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="wallet.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="notify.js"></script>

  <script>
    let me = null;

    // ----- Phone push notifications -----
    const VAPID_PUBLIC_KEY = "BKdCCZIqLZYuHID8tOwzyjKFWBgIp18oPIXOmzJxS5ULYld6w6snQyIf1TCeJVFMeQRboUEl9EeWjAJIYg1aeT4";

    function keyToBytes(base64) {
      const padded = (base64 + "=".repeat((4 - (base64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(padded);
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
    }

    function showPush(title, text, buttonText, kind) {
      document.getElementById("pushCard").hidden = false;
      document.getElementById("pushTitle").textContent = title;
      document.getElementById("pushText").textContent = text;
      const btn = document.getElementById("pushBtn");
      btn.hidden = !buttonText;
      btn.disabled = false;
      if (buttonText) {
        btn.textContent = buttonText;
        btn.className = "btn " + (kind || "btn-primary");
      }
    }

    async function saveSubscription(sub) {
      const json = sub.toJSON();
      const { error } = await sb.rpc("save_push_subscription", {
        p_endpoint: json.endpoint,
        p_p256dh: json.keys.p256dh,
        p_auth: json.keys.auth
      });
      if (error) throw error;
    }

    async function setupPush() {
      const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
      const installed = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

      if (!supported) {
        if (/iPhone|iPad/.test(navigator.userAgent) && !installed) {
          showPush("Get alerts on your phone", "Add splitpot to your home screen first (Share → Add to Home Screen), then open it from there and turn on notifications.");
        } else {
          showPush("Phone alerts aren't available", "This browser doesn't support push notifications. You'll still see everything here.");
        }
        return;
      }

      if (Notification.permission === "denied") {
        showPush("Notifications are blocked", "Turn them on for splitpot in your phone's Settings → Notifications, then come back here.");
        return;
      }

      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.pushManager.getSubscription();

      if (existing && Notification.permission === "granted") {
        await saveSubscription(existing);
        showPush("Notifications are on", "This phone gets an alert when friends join, when it's time to vote, and when games are paid out.", "Turn off on this phone", "btn-secondary");
      } else {
        showPush("Get alerts on your phone", "Know the moment a friend joins, when it's time to vote, and when you win, even with splitpot closed.", "Turn on notifications");
      }
    }

    document.getElementById("pushBtn").addEventListener("click", async () => {
      const btn = document.getElementById("pushBtn");
      btn.disabled = true;

      try {
        const reg = await navigator.serviceWorker.ready;
        const existing = await reg.pushManager.getSubscription();

        if (existing && Notification.permission === "granted") {
          const endpoint = existing.endpoint;
          await existing.unsubscribe();
          await sb.rpc("remove_push_subscription", { p_endpoint: endpoint });
        } else {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") {
            await setupPush();
            return;
          }
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: keyToBytes(VAPID_PUBLIC_KEY)
          });
          await saveSubscription(sub);
        }

        await setupPush();
      } catch (err) {
        showPush("Something went wrong", err.message || "Could not change notification settings. Try again.", "Try again");
      }
    });

    function timeAgo(iso) {
      const seconds = (Date.now() - new Date(iso).getTime()) / 1000;
      if (seconds < 60) return "Just now";
      if (seconds < 3600) return Math.floor(seconds / 60) + " min ago";
      if (seconds < 86400) return Math.floor(seconds / 3600) + " h ago";
      return new Date(iso).toLocaleString("en-NG", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function load() {
      const { data, error } = await sb
        .from("notifications")
        .select("id, body, read_at, created_at, rooms(code)")
        .eq("user_id", me)
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) throw error;

      const list = document.getElementById("list");
      list.innerHTML = "";
      document.getElementById("empty").hidden = data.length > 0;

      data.forEach((n) => {
        const li = el("li");
        const row = el(n.rooms ? "a" : "div", "note" + (n.read_at ? "" : " unread"));
        if (n.rooms) row.href = "room.html?code=" + encodeURIComponent(n.rooms.code);

        const text = el("div");
        text.append(el("p", "body", n.body), el("p", "time", timeAgo(n.created_at)));

        row.append(el("span", "dot"), text);
        li.append(row);
        list.append(li);
      });

      if (data.some((n) => !n.read_at)) {
        await sb
          .from("notifications")
          .update({ read_at: new Date().toISOString() })
          .eq("user_id", me)
          .is("read_at", null);
        if (window.splitpotRefreshBell) window.splitpotRefreshBell();
      }
    }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.replace("login.html?next=notifications.html");
        return;
      }
      me = session.user.id;

      setupPush().catch((err) => console.error("Push setup failed:", err));

      try {
        await load();
        sb.channel("inbox-" + me)
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: "user_id=eq." + me }, () => load())
          .subscribe();
      } catch (err) {
        document.getElementById("error").textContent = err.message || "Could not load notifications.";
      }
    })();
  </script>
</body>
</html>
