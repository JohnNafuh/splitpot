<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="splitpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
  <title>splitpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="index.html">splitpot</a>
    <div class="topbar-right">
      <a class="balance" id="balanceLink" href="login.html">
        <span id="balanceLabel">Account</span>
        <strong id="balanceAmount">Sign in</strong>
      </a>
      <a class="add-pill" id="addPill" href="wallet.html" aria-label="Add money" hidden>+ Add</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Play your friends. Winner takes the pot.</h1>

      <div class="pot">
        <svg id="potChart" viewBox="0 0 200 200" role="img" aria-label="The pot, split equally between players"></svg>
        <div class="pot-center">
          <span class="pot-label">Pot</span>
          <strong id="potTotal">₦10,000</strong>
        </div>
      </div>

      <div class="controls">
        <div class="field">
          <span class="field-label">Players</span>
          <div class="stepper">
            <button type="button" id="minus" aria-label="Fewer players">−</button>
            <output id="playerCount">4</output>
            <button type="button" id="plus" aria-label="More players">+</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="stake">Stake each</label>
          <div class="stake-input">
            <span>₦</span>
            <input id="stake" type="number" inputmode="numeric" min="100" step="100" value="2500">
          </div>
        </div>
      </div>

      <p class="breakdown" id="breakdown" aria-live="polite"></p>
    </section>

    <div class="empty-wallet" id="emptyWallet" hidden>
      <p><strong>Your wallet is empty.</strong> You need money in your wallet to create or join a room.</p>
      <a class="btn btn-primary" href="wallet.html">Add money</a>
    </div>

    <section class="actions">
      <a class="btn btn-primary" href="create.html" id="createLink" data-requires-login>Create a room</a>
      <a class="btn btn-secondary" href="join.html" data-requires-login>Join with a code</a>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="rooms.html" data-requires-login>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.6 1.9 5.3 5.1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="wallet.html" data-requires-login>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="profile.html" data-requires-login>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="fees.js"></script>
  <script src="notify.js"></script>

  <script>
    const MIN_PLAYERS = 2;
    const MAX_PLAYERS = 8;
    let players = 4;

    const svg = document.getElementById("potChart");
    const potTotal = document.getElementById("potTotal");
    const breakdown = document.getElementById("breakdown");
    const countEl = document.getElementById("playerCount");
    const stakeEl = document.getElementById("stake");
    const minus = document.getElementById("minus");
    const plus = document.getElementById("plus");

    const naira = (n) => "₦" + Math.round(n).toLocaleString("en-NG");

    function point(r, angle) {
      return (100 + r * Math.cos(angle)).toFixed(2) + " " + (100 + r * Math.sin(angle)).toFixed(2);
    }

    function slice(a0, a1) {
      const outer = 96, inner = 62;
      const large = a1 - a0 > Math.PI ? 1 : 0;
      return "M" + point(outer, a0) +
        " A" + outer + " " + outer + " 0 " + large + " 1 " + point(outer, a1) +
        " L" + point(inner, a1) +
        " A" + inner + " " + inner + " 0 " + large + " 0 " + point(inner, a0) + " Z";
    }

    function render() {
      const stake = Math.max(0, Number(stakeEl.value) || 0);
      const pot = stake * players;
      const feeInfo = splitpotFee(pot * 100);
      const fee = feeInfo.fee / 100;
      const winnings = pot - fee;

      const step = (Math.PI * 2) / players;
      const gap = 0.05;
      let paths = "";
      for (let i = 0; i < players; i++) {
        const a0 = i * step - Math.PI / 2 + gap / 2;
        const a1 = (i + 1) * step - Math.PI / 2 - gap / 2;
        paths += '<path class="slice' + (i % 2 ? " alt" : "") + '" style="animation-delay:' + (i * 60) + 'ms" d="' + slice(a0, a1) + '"/>';
      }
      svg.innerHTML = paths;

      countEl.textContent = players;
      potTotal.textContent = naira(pot);
      breakdown.textContent = players + " players × " + naira(stake) + ". Winner receives " + naira(winnings) + " after the " + naira(fee) + " platform fee (" + feeInfo.percent + "%).";

      minus.disabled = players <= MIN_PLAYERS;
      plus.disabled = players >= MAX_PLAYERS;
    }

    minus.addEventListener("click", () => { players--; render(); });
    plus.addEventListener("click", () => { players++; render(); });
    stakeEl.addEventListener("input", render);

    render();
    splitpotFeeReady.then(render);

    // Carry the calculator values into the create room page
    let signedIn = false;
    document.getElementById("createLink").addEventListener("click", (event) => {
      if (!signedIn) return;
      event.preventDefault();
      const stake = Math.floor(Math.max(0, Number(stakeEl.value) || 0));
      window.location.href = "create.html?players=" + players + "&stake=" + stake;
    });

    // Account: show real balance when logged in, send to login when not
    async function loadAccount() {
      const link = document.getElementById("balanceLink");
      const label = document.getElementById("balanceLabel");
      const amount = document.getElementById("balanceAmount");

      try {
        const { data: { session } } = await sb.auth.getSession();

        if (!session) {
          document.querySelectorAll("[data-requires-login]").forEach((a) => {
            a.href = "login.html";
          });
          return;
        }

        const { data, error } = await sb
          .from("wallets")
          .select("balance")
          .eq("user_id", session.user.id)
          .maybeSingle();

        if (error) throw error;

        const kobo = data ? data.balance : 0;
        label.textContent = "Wallet";
        amount.textContent = "₦" + (kobo / 100).toLocaleString("en-NG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        link.href = "wallet.html";
        signedIn = true;

        document.getElementById("addPill").hidden = false;
        document.getElementById("emptyWallet").hidden = kobo > 0;
      } catch (err) {
        console.error("Could not load account:", err);
      } finally {
        link.classList.add("ready");
      }
    }

    loadAccount();
  </script>
</body>
</html>
