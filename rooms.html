<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="splitpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
  <title>Rooms · splitpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .rooms {
      padding-top: 24px;
    }

    .rooms h1 {
      font-size: clamp(1.9rem, 8vw, 2.3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .quick .btn {
      min-height: 48px;
      font-size: 1rem;
    }

    .rooms h2 {
      margin-top: 32px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .room-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      padding: 0;
      list-style: none;
    }

    .room-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(8, 36, 25, 0.45);
    }

    .room-card.needs-you {
      border-color: var(--brass);
    }

    .room-card .game {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .room-card .stake {
      font-weight: 600;
      text-align: right;
    }

    .room-card .meta {
      font-size: 0.9rem;
      color: var(--moss);
    }

    .room-card .state {
      font-size: 0.9rem;
      text-align: right;
      color: var(--moss);
      white-space: nowrap;
    }

    .room-card .state.action { color: var(--brass); }
    .room-card .state.won { color: #8FD6A8; }

    .empty {
      margin-top: 12px;
      color: var(--moss);
      line-height: 1.45;
    }

    .error {
      margin-top: 16px;
      color: #F2A39A;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="index.html">splitpot</a>
  </header>

  <main class="rooms">
    <h1>Your rooms</h1>

    <div class="quick">
      <a class="btn btn-primary" href="create.html">Create a room</a>
      <a class="btn btn-secondary" href="join.html">Join with a code</a>
    </div>

    <h2>Active</h2>
    <ul class="room-list" id="activeList"></ul>
    <p class="empty" id="activeEmpty" hidden>No active rooms. Create one or join a friend's room with their code.</p>

    <h2>Finished</h2>
    <ul class="room-list" id="pastList"></ul>
    <p class="empty" id="pastEmpty" hidden>Rooms you've played will show up here.</p>

    <p class="error" id="error" role="alert"></p>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="rooms.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.6 1.9 5.3 5.1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="wallet.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="notify.js"></script>

  <script>
    const ACTIVE = ["waiting", "playing", "voting", "disputed"];
    const naira = (kobo) => "₦" + Math.round(kobo / 100).toLocaleString("en-NG");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function describe(room, myVote, me) {
      switch (room.status) {
        case "waiting":
          return { text: "Waiting for players" };
        case "playing":
        case "voting":
          return myVote
            ? { text: "Waiting for votes" }
            : { text: "Vote now", kind: "action" };
        case "disputed":
          return { text: "Under review" };
        case "settled":
          return room.winner_id === me
            ? { text: "Won " + naira(room.pot - room.fee), kind: "won" }
            : { text: "Lost " + naira(room.stake) };
        case "cancelled":
          return { text: "Refunded" };
        default:
          return { text: room.status };
      }
    }

    function card(room, myVote, me) {
      const state = describe(room, myVote, me);

      const li = el("li");
      const a = el("a", "room-card" + (state.kind === "action" ? " needs-you" : ""));
      a.href = "room.html?code=" + encodeURIComponent(room.code);

      const when = new Date(room.created_at).toLocaleDateString("en-NG", { day: "numeric", month: "short" });

      a.append(
        el("span", "game", room.game),
        el("span", "stake", naira(room.stake)),
        el("span", "meta", room.code + " · " + when),
        el("span", "state" + (state.kind ? " " + state.kind : ""), state.text)
      );

      li.append(a);
      return li;
    }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.replace("login.html?next=rooms.html");
        return;
      }
      const me = session.user.id;

      try {
        const { data, error } = await sb
          .from("room_players")
          .select("vote_for, rooms(*)")
          .eq("user_id", me);

        if (error) throw error;

        const rows = data
          .filter((row) => row.rooms)
          .sort((a, b) => new Date(b.rooms.created_at) - new Date(a.rooms.created_at));

        const active = rows.filter((row) => ACTIVE.includes(row.rooms.status));
        const past = rows.filter((row) => !ACTIVE.includes(row.rooms.status)).slice(0, 30);

        const activeList = document.getElementById("activeList");
        const pastList = document.getElementById("pastList");

        active.forEach((row) => activeList.append(card(row.rooms, row.vote_for, me)));
        past.forEach((row) => pastList.append(card(row.rooms, row.vote_for, me)));

        document.getElementById("activeEmpty").hidden = active.length > 0;
        document.getElementById("pastEmpty").hidden = past.length > 0;
      } catch (err) {
        document.getElementById("error").textContent = err.message || "Could not load your rooms.";
      }
    })();
  </script>
</body>
</html>
