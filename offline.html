<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <title>Offline · splitpot</title>
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .offline {
      display: grid;
      place-content: center;
      min-height: 70vh;
      text-align: center;
    }
    .offline img {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 22px;
    }
    .offline h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .offline p {
      margin-top: 8px;
      color: var(--moss);
      line-height: 1.45;
    }
    .offline .btn {
      margin-top: 24px;
      border: 0;
      padding: 0 28px;
    }
  </style>
</head>
<body>
  <main class="offline">
    <img src="icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>splitpot needs a connection to load rooms and your wallet.<br>Check your data or Wi-Fi and try again.</p>
    <button class="btn btn-primary" type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
