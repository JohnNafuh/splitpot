<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3A2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="splitpot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
  <title>Join a room · splitpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .join {
      padding-top: 24px;
    }

    .join h1 {
      font-size: clamp(1.9rem, 8vw, 2.3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .join .hint {
      margin-top: 8px;
      color: var(--moss);
      line-height: 1.45;
    }

    .code-input {
      width: 100%;
      min-height: 72px;
      margin-top: 24px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8, 36, 25, 0.45);
      color: var(--brass);
      font: inherit;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .code-input:focus {
      outline: none;
      border-color: var(--brass);
    }

    .join .btn {
      width: 100%;
      margin-top: 16px;
      border: 0;
    }

    .join .btn:disabled {
      opacity: 0.5;
    }

    .error {
      min-height: 1.4em;
      margin-top: 10px;
      color: #F2A39A;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="wordmark" href="index.html">splitpot</a>
  </header>

  <main class="join">
    <h1>Join a room</h1>
    <p class="hint">Enter the 6-character code your friend shared.</p>

    <form id="joinForm" novalidate>
      <input class="code-input" id="code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="K7P2QX">
      <button class="btn btn-primary" type="submit" id="findBtn" disabled>Find room</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="rooms.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.1 4.6 1.9 5.3 5.1"/></svg>
      <span>Rooms</span>
    </a>
    <a href="wallet.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="notify.js"></script>

  <script>
    const input = document.getElementById("code");
    const findBtn = document.getElementById("findBtn");
    const errorEl = document.getElementById("error");

    input.addEventListener("input", () => {
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      findBtn.disabled = input.value.length !== 6;
      errorEl.textContent = "";
    });

    document.getElementById("joinForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const code = input.value;
      if (!/^[A-Z0-9]{6}$/.test(code)) {
        errorEl.textContent = "Room codes are 6 letters and numbers.";
        return;
      }
      window.location.href = "room.html?code=" + code;
    });
  </script>
</body>
</html>
